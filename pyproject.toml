[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leanpass-plugins"
version = "0.1.0"
description = "Plugin system for LeanPass"
authors = [
    {name = "LeanPass Contributors"}
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["leanpass_plugins", "plugins"]

